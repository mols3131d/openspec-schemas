name: Repository checks

on:
  pull_request:
    paths-ignore:
      - ".inbox/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".inbox/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
      - run: mise run agents-check
      - run: mise run schema-check
      - run: mise exec -- node --test tests/scripts/manage-agent-assets.test.ts
      - run: mise run markdown-check
      - run: mise exec -- biome check .
      - run: mise exec -- lefthook validate
